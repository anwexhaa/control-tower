<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Control Tower</title>
    <meta
      name="description"
      content="A live freight command centre for Indian enterprise logistics."
    />

    <!-- Applied before first paint so the console never flashes the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ct.theme");
          var d = localStorage.getItem("ct.density");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
          document.documentElement.dataset.density =
            d === "compact" ? "compact" : "comfortable";
        } catch (e) {
          /* blocked storage — the markup defaults already apply */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
